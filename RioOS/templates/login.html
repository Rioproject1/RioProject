<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · RioOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#164e63,#0f172a 58%);font-family:Inter,Arial,sans-serif;color:#f8fafc;padding:20px}
.panel{width:min(420px,100%);padding:34px;border:1px solid #334155;border-radius:22px;background:rgba(15,23,42,.92);box-shadow:0 25px 80px #02061799}
.logo{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px}.logo i{color:#38bdf8}.sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:28px}
label{display:block;font-size:13px;color:#cbd5e1;margin:15px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #475569;border-radius:10px;background:#0b1220;color:white;font-size:14px;outline:none}input:focus{border-color:#38bdf8}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#38bdf8;color:#082f49;font-weight:800;font-size:14px;cursor:pointer}
.notice{padding:12px;border-radius:10px;background:#422006;color:#fde68a;font-size:12px;line-height:1.6;margin-bottom:16px}.error{color:#fca5a5;font-size:13px;margin-top:14px;min-height:18px;text-align:center}
</style>
</head>
<body><main class="panel">
<div class="logo"><i class="fa-solid fa-server"></i> RioOS</div>
<div class="sub">Secure Server Management · Sign in</div>
{% if setup_missing %}
<div class="notice"><b>Admin belum dikonfigurasi.</b><br>Atur environment variable <code>RIOOS_ADMIN_USERNAME</code> dan <code>RIOOS_ADMIN_PASSWORD</code> pada server, lalu jalankan ulang RioOS.</div>
{% endif %}
<form id="login-form">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" {% if setup_missing %}disabled style="opacity:.45;cursor:not-allowed"{% endif %}><i class="fa-solid fa-right-to-bracket"></i> Login</button>
<div class="error" id="error"></div>
</form>
</main>
<script>
document.getElementById('login-form').addEventListener('submit',async e=>{
 e.preventDefault(); const error=document.getElementById('error'); error.textContent='Memeriksa akun...';
 try{
  const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
  const data=await res.json(); if(!res.ok) throw new Error(data.error||'Login gagal');
  location.href='/';
 }catch(err){error.textContent=err.message;}
});
</script></body></html>
